version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd AI-Resume-Screening-System/frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: AI-Resume-Screening-System/frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - AI-Resume-Screening-System/frontend/node_modules/**/*
