version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd ai-resume-screening/frontend
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: ai-resume-screening/frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - ai-resume-screening/frontend/node_modules/**/*
